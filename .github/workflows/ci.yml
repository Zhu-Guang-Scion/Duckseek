name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff, zero warnings)
        run: uv run ruff check .

      - name: Test (pytest, fast suite)
        run: uv run pytest -m "not slow"
