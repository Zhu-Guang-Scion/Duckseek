[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2data"
version = "0.1.0"
description = "Query large Excel/Access datasets with natural language (Milestone 1: ingestion and profiling)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "nl2data contributors" }]
requires-python = ">=3.11"
keywords = ["nl2sql", "excel", "access", "duckdb", "text2sql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pypinyin>=0.53",
    "sqlglot>=30.18.0",
    "lancedb[pylance]>=0.38,<0.39",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "openai>=3.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "openpyxl>=3.1",
]

[project.scripts]
nl2data = "nl2data.cli:run"

[tool.setuptools]
packages = [
    "nl2data",
    "llm",
    "ingest",
    "catalog",
    "retrieval",
    "sqlgen",
    "guard",
    "exec",
    "eval",
]

[tool.setuptools.package-data]
nl2data = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
# ANN401: YAML/config parsing boundaries legitimately use `Any`.
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = [
    "nl2data",
    "ingest",
    "catalog",
    "retrieval",
    "sqlgen",
    "guard",
    "exec",
    "eval",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = [
    "slow: long-running tests that exercise large fixtures (run with -m slow)",
]

[tool.coverage.run]
source = [
    "nl2data",
    "ingest",
    "catalog",
    "retrieval",
    "sqlgen",
    "guard",
    "exec",
    "eval",
]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
