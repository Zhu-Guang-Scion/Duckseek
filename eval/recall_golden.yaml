  - section: "四、干扰型跨表层"
    question: "所有收取拥堵附加费的订单，主要分布在哪些行政区？"
    expected_tables: [yellow_tripdata, green_tripdata, taxi_zones]
    note: "congestion_surcharge为两表共有字段；「所有订单」需覆盖双表，同时关联区域维度"
    expected_sql: |
      SELECT z.borough, COUNT(*) AS order_count
      FROM (
        SELECT t.pulocationid AS lid FROM yellow_tripdata t
        WHERE t.congestion_surcharge > 0
        UNION ALL
        SELECT g.pulocationid FROM green_tripdata g
        WHERE g.congestion_surcharge > 0
      ) v
      JOIN taxi_zones z ON v.lid = z.locationid
      GROUP BY z.borough
      ORDER BY order_count DESC
    expected_result:
      columns: ["borough", "order_count"]
      rowcount: 7
      rows:
