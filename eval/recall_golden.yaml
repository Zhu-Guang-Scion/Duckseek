# nl2data 检索召回 golden 评测集(T7 recall runner 的输入)
#
# - 数据来源:NYC TLC Trip Record Data 2026-03 切片(yellow/green,3,952,451 行 /
#   44,208 行)+ 官方 taxi_zone_lookup.csv(265 行,转换为 Parquet 注册)。
# - 录入日期:2026-09-18。
# - 表名映射说明:三张表以恒等映射注册(yellow_tripdata / green_tripdata /
#   taxi_zones,表名 == catalog 安全名),expected_tables 原样使用逻辑名,
#   未发生任何批量替换。
# - 用例数量:20 条(早期任务书"24"为笔误,人类已确认以 20 条为准)。
# - question / note 原样保留人类提供措辞,不得改写。
cases:
  # ============== 一、单表精准区分层（基础必测） ==============
  # 设计目的：验证双表共存下能准确识别业务主体，不串表、不错召
  # 对应失败模式：黄/绿车语义混淆、业务主体识别错误、表名映射偏差
  - section: "一、单表精准区分层"
    question: "2026年3月黄色出租车的总订单量是多少？"
    expected_tables: [yellow_tripdata]
    note: "明确业务主体为黄车，验证不会误召回绿车表"
    expected_sql: |
      SELECT COUNT(*) AS order_count
      FROM yellow_tripdata
      WHERE date_trunc('month', tpep_pickup_datetime) = DATE '2026-03-01'
    expected_result:
      columns: ["order_count"]
      rowcount: 1
      rows:
        - [3952432]
    result_tolerance: exact

  - section: "一、单表精准区分层"
    question: "绿色出租车的平均行程距离是多少英里？"
    expected_tables: [green_tripdata]
    note: "明确业务主体为绿车，验证不会误召回黄车表"
    expected_sql: |
      SELECT AVG(trip_distance) AS avg_trip_distance
      FROM green_tripdata
    expected_result:
      columns: ["avg_trip_distance"]
      rowcount: 1
      rows:
        - [12.249314151284823]
    result_tolerance: float_rel_1e_4

  - section: "一、单表精准区分层"
    question: "所有订单的电召费总收入是多少？"
    expected_tables: [green_tripdata]
    note: "ehail_fee为绿车独有字段，验证不会因「所有订单」误导召回黄车表"
    expected_sql: |
      SELECT SUM(ehail_fee) AS total_ehail_fee
      FROM green_tripdata
    expected_result:
      columns: ["total_ehail_fee"]
      rowcount: 1
      rows:
        - [null]
    result_tolerance: exact

  - section: "一、单表精准区分层"
    question: "信用卡支付的订单占比是多少？"
    expected_tables: [yellow_tripdata, green_tripdata]
    note: "未限定车型时，支付方式为两张表共有字段，需同时召回双表统计全量订单"
    expected_sql: |
      SELECT ROUND(SUM(credit_cnt) * 100.0 / SUM(cnt), 2) AS credit_pct
      FROM (
        SELECT COUNT(*) AS cnt, COUNT(*) FILTER (WHERE payment_type = 1) AS credit_cnt
        FROM yellow_tripdata
        UNION ALL
        SELECT COUNT(*), COUNT(*) FILTER (WHERE payment_type = 1)
        FROM green_tripdata
      ) t
    expected_result:
      columns: ["credit_pct"]
      rowcount: 1
      rows:
        - [65.99]
    result_tolerance: float_rel_1e_4

  # ============== 二、单事实表+维度表 标准跨表层 ==============
  # 设计目的：验证每张行程表都能独立正确关联共享维度表，不漏关联、不错关联
  # 对应失败模式：ID字段无维度意识、区域语义仅映射单表、维度表漏召
  - section: "二、单事实表+维度表 标准跨表层"
    question: "曼哈顿区黄色出租车的上客订单量有多少？"
    expected_tables: [yellow_tripdata, taxi_zones]
    note: "黄车+区域维度；PULocationID为数字编码，需关联taxi_zones获取行政区"
    expected_sql: |
      SELECT COUNT(*) AS order_count
      FROM yellow_tripdata t
      JOIN taxi_zones z ON t.pulocationid = z.locationid
      WHERE z.borough = 'Manhattan'
    expected_result:
      columns: ["order_count"]
      rowcount: 1
      rows:
        - [3391948]
    result_tolerance: exact

  - section: "二、单事实表+维度表 标准跨表层"
    question: "布鲁克林区绿色出租车的平均总车费是多少？"
    expected_tables: [green_tripdata, taxi_zones]
    note: "绿车+区域维度；验证绿车的LocationID也能正确映射到共享维度表"
    expected_sql: |
      SELECT AVG(t.total_amount) AS avg_total_amount
      FROM green_tripdata t
      JOIN taxi_zones z ON t.pulocationid = z.locationid
      WHERE z.borough = 'Brooklyn'
    expected_result:
      columns: ["avg_total_amount"]
      rowcount: 1
      rows:
        - [29.57466009064254]
    result_tolerance: float_rel_1e_4

  - section: "二、单事实表+维度表 标准跨表层"
    question: "肯尼迪机场上客的绿车订单中，街招单和网约单各占多少？"
    expected_tables: [green_tripdata, taxi_zones]
    note: "绿车独有trip_type编码 + 区域维度；需同时识别业务编码和区域关联"
    expected_sql: |
      SELECT t.trip_type, COUNT(*) AS order_count
      FROM green_tripdata t
      JOIN taxi_zones z ON t.pulocationid = z.locationid
      WHERE z.zone = 'JFK Airport'
      GROUP BY t.trip_type
      ORDER BY t.trip_type
    expected_result:
      columns: ["trip_type", "order_count"]
      rowcount: 3
      rows:
        - [1, 6]
        - [2, 4]
        - [null, 1]
    result_tolerance: exact

  - section: "二、单事实表+维度表 标准跨表层"
    question: "上客量最高的5个区域中，黄车订单量分别是多少？"
    expected_tables: [yellow_tripdata, taxi_zones]
    note: "需关联维度表返回区域名称，仅行程表无法输出可读区域名"
    expected_sql: |
      SELECT z.zone, COUNT(*) AS pickup_count
      FROM yellow_tripdata t
      JOIN taxi_zones z ON t.pulocationid = z.locationid
      GROUP BY z.zone
      ORDER BY pickup_count DESC
      LIMIT 5
    expected_result:
      columns: ["zone", "pickup_count"]
      rowcount: 5
      rows:
        - ["Upper East Side South", 174403]
        - ["Midtown Center", 165350]
        - ["Upper East Side North", 157296]
        - ["JFK Airport", 153791]
        - ["Midtown East", 121946]
    result_tolerance: exact

  # ============== 三、双事实表联合对比跨表层（双表专属核心用例） ==============
  # 设计目的：验证对比分析场景下，能同时召回两张行程事实表并按需关联维度
  # 对应失败模式：对比场景仅召回单表、遗漏其中一类业务数据、维度表重复关联错误
  - section: "三、双事实表联合对比跨表层"
    question: "2026年3月黄车和绿车的总订单量分别是多少？"
    expected_tables: [yellow_tripdata, green_tripdata]
    note: "双表横向对比；验证不会只召回其中一张行程表"
    expected_sql: |
      SELECT 'yellow' AS vehicle, COUNT(*) AS march_orders
      FROM yellow_tripdata
      WHERE date_trunc('month', tpep_pickup_datetime) = DATE '2026-03-01'
      UNION ALL
      SELECT 'green', COUNT(*)
      FROM green_tripdata
      WHERE date_trunc('month', lpep_pickup_datetime) = DATE '2026-03-01'
    expected_result:
      columns: ["vehicle", "march_orders"]
      rowcount: 2
      rows:
        - ["yellow", 3952432]
        - ["green", 44199]
    result_tolerance: exact

  - section: "三、双事实表联合对比跨表层"
    question: "各个行政区的黄车与绿车订单量分别是多少？"
    expected_tables: [yellow_tripdata, green_tripdata, taxi_zones]
    note: "双事实表+共享维度表；需两张行程表分别关联taxi_zones后聚合对比"
    expected_sql: |
      SELECT z.borough,
             SUM(CASE WHEN v.vehicle = 'yellow' THEN v.cnt ELSE 0 END) AS yellow_orders,
             SUM(CASE WHEN v.vehicle = 'green'  THEN v.cnt ELSE 0 END) AS green_orders
      FROM (
        SELECT 'yellow' AS vehicle, t.pulocationid AS lid, COUNT(*) AS cnt
        FROM yellow_tripdata t GROUP BY t.pulocationid
        UNION ALL
        SELECT 'green', g.pulocationid, COUNT(*)
        FROM green_tripdata g GROUP BY g.pulocationid
      ) v
      JOIN taxi_zones z ON v.lid = z.locationid
      GROUP BY z.borough
      ORDER BY z.borough
    expected_result:
      columns: ["borough", "yellow_orders", "green_orders"]
      rowcount: 8
      rows:
        - ["Bronx", 39925, 932]
        - ["Brooklyn", 160128, 7502]
        - ["EWR", 527, 0]
        - ["Manhattan", 3391948, 25640]
        - ["Queens", 353174, 9973]
        - ["Staten Island", 500, 21]
        - ["Unknown", 4624, 99]
        - [null, 1625, 41]
    result_tolerance: exact

  - section: "三、双事实表联合对比跨表层"
    question: "曼哈顿区早高峰（7-9点），黄车和绿车哪个平均车费更高？"
    expected_tables: [yellow_tripdata, green_tripdata, taxi_zones]
    note: "区域限定+时间维度+双表对比；需同时识别区域关联、时间提取、双表召回"
    note2: "对比类问题（哪个更高/更低）的口径为输出双方数值的比较表；top-1 单行不构成完整答案。"
    expected_sql: |
      SELECT 'yellow' AS vehicle, AVG(t.fare_amount) AS avg_fare
      FROM yellow_tripdata t
      JOIN taxi_zones z ON t.pulocationid = z.locationid
      WHERE z.borough = 'Manhattan'
        AND EXTRACT(HOUR FROM t.tpep_pickup_datetime) >= 7
        AND EXTRACT(HOUR FROM t.tpep_pickup_datetime) < 9
      UNION ALL
      SELECT 'green', AVG(g.fare_amount)
      FROM green_tripdata g
      JOIN taxi_zones z ON g.pulocationid = z.locationid
      WHERE z.borough = 'Manhattan'
        AND EXTRACT(HOUR FROM g.lpep_pickup_datetime) >= 7
        AND EXTRACT(HOUR FROM g.lpep_pickup_datetime) < 9
    expected_result:
      columns: ["vehicle", "avg_fare"]
      rowcount: 2
      rows:
        - ["yellow", 18.544088160309773]
        - ["green", 14.6882245271507]
    result_tolerance: float_rel_1e_4

  - section: "三、双事实表联合对比跨表层"
    question: "全市范围内，黄车和绿车的平均小费率分别是多少？"
    expected_tables: [yellow_tripdata, green_tripdata]
    note: "双表业务指标对比；小费率=tip_amount/fare_amount，现金单均为0，业务逻辑一致"
    expected_sql: |
      SELECT 'yellow' AS vehicle,
             AVG(t.tip_amount / NULLIF(t.fare_amount, 0)) AS avg_tip_rate
      FROM yellow_tripdata t
      WHERE t.payment_type = 1
      UNION ALL
      SELECT 'green', AVG(g.tip_amount / NULLIF(g.fare_amount, 0))
      FROM green_tripdata g
      WHERE g.payment_type = 1
    expected_result:
      columns: ["vehicle", "avg_tip_rate"]
      rowcount: 2
      rows:
        - ["yellow", 0.25148572735032454]
        - ["green", 0.2785388421273189]
    result_tolerance: float_rel_1e_4

  - section: "三、双事实表联合对比跨表层"
    question: "布鲁克林上客、曼哈顿下客的订单中，黄车和绿车各有多少单？"
    expected_tables: [yellow_tripdata, green_tripdata, taxi_zones]
    note: "起终点双维度+双表对比；需两次关联维度表，且覆盖两张行程表"
    expected_sql: |
      SELECT 'yellow' AS vehicle, COUNT(*) AS order_count
      FROM yellow_tripdata t
      JOIN taxi_zones pu ON t.pulocationid = pu.locationid
      JOIN taxi_zones dz ON t.dolocationid = dz.locationid
      WHERE pu.borough = 'Brooklyn' AND dz.borough = 'Manhattan'
      UNION ALL
      SELECT 'green', COUNT(*)
      FROM green_tripdata g
      JOIN taxi_zones pu ON g.pulocationid = pu.locationid
      JOIN taxi_zones dz ON g.dolocationid = dz.locationid
      WHERE pu.borough = 'Brooklyn' AND dz.borough = 'Manhattan'
    expected_result:
      columns: ["vehicle", "order_count"]
      rowcount: 2
      rows:
        - ["yellow", 49906]
        - ["green", 1252]
    result_tolerance: exact

  # ============== 四、干扰型跨表层（抗混淆校验） ==============
  # 设计目的：在干扰关键词、模糊描述下，验证召回表的准确性
  # 对应失败模式：关键词优先于业务主体、漏召/多召表、维度表遗漏
  - section: "四、干扰型跨表层"
    question: "每个区域的总订单量（含黄车和绿车）是多少？"
    expected_tables: [yellow_tripdata, green_tripdata, taxi_zones]
    note: "「总订单量」易误导仅召回单表；需双行程表累加后再关联区域维度"
    expected_sql: |
      SELECT z.zone, SUM(v.cnt) AS total_orders
      FROM (
        SELECT t.pulocationid AS lid, COUNT(*) AS cnt
        FROM yellow_tripdata t GROUP BY t.pulocationid
        UNION ALL
        SELECT g.pulocationid, COUNT(*)
        FROM green_tripdata g GROUP BY g.pulocationid
      ) v
      JOIN taxi_zones z ON v.lid = z.locationid
      GROUP BY z.zone
      ORDER BY total_orders DESC
