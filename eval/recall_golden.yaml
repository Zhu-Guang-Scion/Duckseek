  - section: "四、干扰型跨表层"
    question: "支付类型为现金的订单，平均行程距离最短的是哪个行政区？"
    expected_tables: [yellow_tripdata, green_tripdata, taxi_zones]
    note: "支付类型为双表共有字段；未限定车型时需覆盖双表，同时关联区域维度排序"
    expected_sql: |
      SELECT z.borough, AVG(v.trip_distance) AS avg_trip_distance
      FROM (
        SELECT t.pulocationid AS lid, t.trip_distance FROM yellow_tripdata t
        WHERE t.payment_type = 2
        UNION ALL
        SELECT g.pulocationid, g.trip_distance FROM green_tripdata g
        WHERE g.payment_type = 2
      ) v
      JOIN taxi_zones z ON v.lid = z.locationid
      GROUP BY z.borough
      ORDER BY avg_trip_distance ASC
      LIMIT 1
    expected_result:
      columns: ["borough", "avg_trip_distance"]
      rowcount: 1
      rows:
        - ["EWR", 0.1637142857142857]
    result_tolerance: float_rel_1e_4

  # ============== 五、隐含业务规则+跨表层 ==============
  # 设计目的：结合脏数据过滤、业务编码规则，同时验证表主体识别与维度关联
  # 对应失败模式：只识别过滤逻辑，忽略表主体或维度关联
  - section: "五、隐含业务规则+跨表层"
    question: "2026年3月曼哈顿的有效绿车订单平均车费是多少？"
    expected_tables: [green_tripdata, taxi_zones]
    note: "隐含零行程、负金额脏数据过滤；同时「曼哈顿」需关联区域维度表"
    expected_sql: |
      SELECT AVG(t.fare_amount) AS avg_fare
      FROM green_tripdata t
      JOIN taxi_zones z ON t.pulocationid = z.locationid
      WHERE z.borough = 'Manhattan'
        AND date_trunc('month', t.lpep_pickup_datetime) = DATE '2026-03-01'
        AND t.trip_distance > 0
        AND t.fare_amount > 0
    expected_result:
      columns: ["avg_fare"]
      rowcount: 1
      rows:
        - [15.16388061489312]
    result_tolerance: float_rel_1e_4

  - section: "五、隐含业务规则+跨表层"
    question: "有小费的订单中，各个行政区黄车和绿车的单量占比分别是多少？"
    expected_tables: [yellow_tripdata, green_tripdata, taxi_zones]
    note: "隐含tip_amount>0过滤；需双表分别过滤后关联维度，再计算占比"
    expected_sql: |
      SELECT z.borough, v.vehicle,
             COUNT(*) AS order_count,
             ROUND(COUNT(*) * 100.0 / SUM(COUNT(*)) OVER (PARTITION BY z.borough), 2) AS pct_in_borough
      FROM (
        SELECT 'yellow' AS vehicle, t.pulocationid AS lid
        FROM yellow_tripdata t WHERE t.tip_amount > 0
        UNION ALL
        SELECT 'green', g.pulocationid
        FROM green_tripdata g WHERE g.tip_amount > 0
      ) v
      JOIN taxi_zones z ON v.lid = z.locationid
      GROUP BY z.borough, v.vehicle
      ORDER BY z.borough, v.vehicle
    expected_result:
      columns: ["borough", "vehicle", "order_count", "pct_in_borough"]
      rowcount: 15
      rows:
        - ["Bronx", "green", 79, 11.32]
        - ["Bronx", "yellow", 619, 88.68]
        - ["Brooklyn", "green", 3920, 20.8]
        - ["Brooklyn", "yellow", 14923, 79.2]
        - ["EWR", "yellow", 302, 100.0]
        - ["Manhattan", "green", 17795, 0.8]
        - ["Manhattan", "yellow", 2219154, 99.2]
        - ["Queens", "green", 5126, 2.47]
        - ["Queens", "yellow", 202387, 97.53]
        - ["Staten Island", "green", 11, 25.58]
        - ["Staten Island", "yellow", 32, 74.42]
        - ["Unknown", "green", 49, 1.38]
        - ["Unknown", "yellow", 3490, 98.62]
        - [null, "green", 10, 1.2]
        - [null, "yellow", 820, 98.8]
    result_tolerance: float_rel_1e_4

  - section: "五、隐含业务规则+跨表层"
    question: "正常费率下，工作日晚高峰（17-19点）哪个区的绿车订单量最高？"
    expected_tables: [green_tripdata, taxi_zones]
    note: "隐含RatecodeID=1正常费率过滤、工作日/小时时间提取；同时关联区域维度排序"
    expected_sql: |
      SELECT z.borough, COUNT(*) AS order_count
      FROM green_tripdata t
      JOIN taxi_zones z ON t.pulocationid = z.locationid
      WHERE t.ratecodeid = 1
        AND EXTRACT(ISODOW FROM t.lpep_pickup_datetime) < 6
        AND EXTRACT(HOUR FROM t.lpep_pickup_datetime) >= 17
        AND EXTRACT(HOUR FROM t.lpep_pickup_datetime) < 19
      GROUP BY z.borough
      ORDER BY order_count DESC
      LIMIT 1
    expected_result:
      columns: ["borough", "order_count"]
      rowcount: 1
      rows:
        - ["Manhattan", 2756]
    result_tolerance: exact
